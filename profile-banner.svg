<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Sai Krishna — QA Automation Engineer</title>
  <desc id="desc">A dark terminal-inspired GitHub profile banner featuring Python, API testing, and UI automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B18"/>
      <stop offset="0.55" stop-color="#11152B"/>
      <stop offset="1" stop-color="#061B20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
