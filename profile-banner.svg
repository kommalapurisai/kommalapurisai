      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171F35"/>
      <stop offset="1" stop-color="#0D1323"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="1194" height="454" rx="28" fill="url(#bg)" stroke="url(#accent)" stroke-width="2"/>
  <path d="M4 116 H1196" stroke="#2DD4BF" stroke-opacity=".35" stroke-width="2"/>
  <rect x="28" y="26" width="420" height="408" rx="22" fill="url(#panel)" stroke="#34405C"/>
  <rect x="472" y="26" width="700" height="408" rx="22" fill="url(#panel)" stroke="#34405C"/>
